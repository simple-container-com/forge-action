name: 'Simple Forge Claude Workflow (Dockerless)'
description: 'Execute Claude-powered code generation workflows for GitHub issues without Docker containers'
author: 'simple-container-com'

branding:
  icon: 'code'
  color: 'blue'

inputs:
  job_id:
    description: 'Job ID from the queue'
    required: true
  issue_id:
    description: 'GitHub issue ID'
    required: true
  service_url:
    description: 'Simple Forge service URL'
    required: false
    default: 'https://forge.simple-container.com'
  model_name:
    description: 'Claude model to use for generation'
    required: false
    type: string
    default: 'claude-sonnet-4-5'
  branch:
    description: 'Target branch for changes'
    required: true
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  simple_forge_api_key:
    description: 'Simple Forge API key'
    required: true
  github_token:
    description: 'GitHub token for repository access'
    required: true
  script_version:
    description: 'Version of scripts to use (default: latest)'
    required: false
    default: 'latest'
  skip_dependency_install:
    description: 'Skip automatic dependency installation (default: false)'
    required: false
    default: 'false'

outputs:
  status:
    description: 'Workflow execution status'
    value: ${{ steps.execute_workflow.outputs.status }}
  branch:
    description: 'Branch where changes were made'
    value: ${{ inputs.branch }}
  workflow_url:
    description: 'URL to the workflow run'
    value: ${{ steps.execute_workflow.outputs.workflow_url }}

runs:
  using: 'composite'
  steps:
    - name: Setup environment
      shell: bash
      run: |
        echo "🔧 Setting up Simple Forge environment..."
        export SIMPLE_FORGE_WORK_DIR="${GITHUB_WORKSPACE}/.simple-forge"
        mkdir -p "$SIMPLE_FORGE_WORK_DIR"
        echo "SIMPLE_FORGE_WORK_DIR=$SIMPLE_FORGE_WORK_DIR" >> $GITHUB_ENV
        echo "✅ Environment setup complete"

    - name: Detect platform
      shell: bash
      run: |
        echo "🔍 Detecting platform..."
        chmod +x "${{ github.action_path }}/scripts/detect-platform.sh"
        "${{ github.action_path }}/scripts/detect-platform.sh"

    - name: Install dependencies
      if: inputs.skip_dependency_install != 'true'
      shell: bash
      run: |
        echo "📦 Installing dependencies..."
        chmod +x "${{ github.action_path }}/scripts/install-dependencies.sh"
        "${{ github.action_path }}/scripts/install-dependencies.sh"

    - name: Acquire workflow scripts
      shell: bash
      run: |
        echo "📥 Acquiring workflow scripts..."
        chmod +x "${{ github.action_path }}/scripts/acquire-scripts.sh"
        "${{ github.action_path }}/scripts/acquire-scripts.sh" \
          "${{ inputs.script_version }}"

    - name: Configure Git Authentication
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        echo "🔐 Configuring git authentication..."
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Use the x-access-token format that we validated works
        git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        
        # Also set up credential helper as backup
        git config --global credential.helper store
        echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
        
        # Set remote URL for current repo if it exists
        if [ -d ".git" ]; then
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" || true
        fi
        
        # Debug: Show git configuration
        echo "Debug: Git URL rewrite config:"
        git config --get-regexp url || echo "No URL config found"
        
        echo "✅ Git authentication configured"

    - name: Execute workflow
      id: execute_workflow
      shell: bash
      env:
        JOB_ID: ${{ inputs.job_id }}
        ISSUE_ID: ${{ inputs.issue_id }}
        SERVICE_URL: ${{ inputs.service_url }}
        BRANCH: ${{ inputs.branch }}
        MODEL_NAME: ${{ inputs.model_name }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        SIMPLE_FORGE_API_KEY: ${{ inputs.simple_forge_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        API_URL: ${{ inputs.service_url }}
        STREAMING_API_URL: ${{ inputs.service_url }}
        API_KEY: ${{ inputs.simple_forge_api_key }}
      run: |
        echo "🚀 Executing Simple Forge workflow..."
        echo "🔍 DEBUG: Input validation..."
        echo "  simple_forge_api_key input: $([ -n '${{ inputs.simple_forge_api_key }}' ] && echo '[SET]' || echo '[EMPTY]')"
        echo "  API_KEY env var: $([ -n "$API_KEY" ] && echo "[SET - ${#API_KEY} chars]" || echo "[EMPTY]")"
        chmod +x "${{ github.action_path }}/scripts/orchestrate-workflow.sh"
        "${{ github.action_path }}/scripts/orchestrate-workflow.sh" \
          "${{ inputs.job_id }}" \
          "${{ inputs.issue_id }}" \
          "${{ inputs.service_url }}" \
          "${{ inputs.branch }}" \
          "${{ github.repository }}" \
          "${{ github.run_id }}" \
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          "${{ inputs.simple_forge_api_key }}"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        echo "🧹 Cleaning up..."
        chmod +x "${{ github.action_path }}/scripts/cleanup.sh"
        "${{ github.action_path }}/scripts/cleanup.sh" || true
